# =============================================================================
# build-push-twenty.yml — сборка образа Twenty из форка → GHCR → деплой
#
# Триггер: ТОЛЬКО merge/push в main (dev-ветка — просто сохранение кода,
#          ничего не собирается и не деплоится). Плюс ручной workflow_dispatch.
#
# Шаги:
#   1. docker build --target twenty (server + frontend, порт 3000)
#      из packages/twenty-docker/twenty/Dockerfile
#   2. push в ghcr.io/we2go/crm-twenty:main (+ :sha-<short>) — кэш из GHCR
#   3. SSH-деплой на сервер: git pull конфига → docker compose pull → up -d
#
# Secrets (добавить в we2go/crm-twenty → Settings → Secrets):
#   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY  — те же, что в других репо we2go
# =============================================================================
name: Build & Push Twenty image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-twenty
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/we2go/crm-twenty:main
            ghcr.io/we2go/crm-twenty:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/we2go/crm-twenty:cache
          cache-to: type=registry,ref=ghcr.io/we2go/crm-twenty:cache,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "=== Twenty CRM deploy (from crm-twenty build): $(date -u) ==="

            # Конфиг уже на сервере (/srv/app/twenty/) — из server-репо.
            # Здесь только подтягиваем новый образ и перезапускаем.
            cd /srv/app
            docker compose -f twenty/docker-compose.yml pull
            docker compose -f twenty/docker-compose.yml up -d

            sleep 15
            docker compose -f twenty/docker-compose.yml ps twenty-server twenty-worker twenty-db twenty-redis
            curl -sf https://crm.smokky.club/healthz || { echo "Health check FAILED"; exit 1; }

            echo "=== Deploy complete ==="
